<link rel="preload" href="assets/newsreader.woff2" as="font" type="font/woff2" crossorigin>

<style>
@font-face{font-family:Figtree;src:url(assets/figtree.woff2) format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:Newsreader;src:url(assets/newsreader.woff2) format("woff2");font-weight:500 700;font-style:normal;font-display:swap}
@font-face{font-family:Newsreader;src:url(assets/newsreader-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
:root{
  --forest:#365233;--forest-d:#223520;--leaf:#7BA569;--leaf-l:#DDE9D5;--page:#F2F5EE;
  --ink:#1A2A1B;--mute:#566757;--line:#D6DFD0;--gold:#E0A93B;--gold-l:#FBF0D6;
  --bad:#A8392B;--bad-l:#F9E3DF;--ok:#2F7A3D;--ok-l:#E0F0DC;
  --sans:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:Newsreader,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 17px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.12;margin:0}
p{margin:0 0 12px}
img{max-width:100%;height:auto}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* boot shell */
.boot{display:flex;justify-content:center;padding:40vh 20px 0}
.boot img{width:220px}

/* header */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:rgba(242,245,238,.94);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:block;line-height:0}.brand img{height:22px;width:auto}
.top-r{display:flex;align-items:center;gap:14px}
.sync{font-size:13px;color:var(--mute);white-space:nowrap}.sync.warn{color:var(--bad);font-weight:600}
.link{white-space:nowrap;background:none;border:0;padding:8px 4px;font-weight:600;color:var(--forest);text-decoration:underline;text-underline-offset:3px}

@media(max-width:480px){.sync:not(.warn){display:none}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border:0;border-radius:14px;font-weight:600;font-size:17px;text-decoration:none;transition:background .15s}
.btn.primary{background:var(--forest);color:#fff}.btn.primary:hover{background:var(--forest-d)}
.btn.gold{background:var(--gold);color:#2B1F00}.btn.gold:hover{background:#EDB94E}
.btn.ghost{background:transparent;color:var(--forest);border:2px solid var(--line)}.btn.ghost:hover{border-color:var(--forest)}
.btn.block{display:flex;width:100%;margin-top:12px}
.btn.small{min-height:40px;padding:0 14px;font-size:15px}
.btn:disabled{opacity:.42;cursor:not-allowed}

/* layout */
.wrap{max-width:1040px;margin:0 auto;padding:22px 16px 24px}
.wrap-s{max-width:560px;margin:0 auto;padding:30px 20px 60px}
.sec{font-size:24px;margin:26px 0 12px}

/* home */
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:6px}
.hero h1{font-size:34px;margin-bottom:8px}
.hero p{color:var(--mute);margin:0}
.ring{flex:none}.ring-t{font:700 24px var(--sans);fill:var(--ink)}
.stats{font-size:14px;color:var(--mute);margin:10px 0 4px}
.home-r .sec{margin-top:22px}
.lessons,.alist{list-style:none;margin:0;padding:0}
.lrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.lrow:hover{border-color:var(--forest)}
.num{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--leaf-l);color:var(--forest);font-weight:700}
.lrow.full .num{background:var(--forest);color:#fff}
.ltxt{flex:1;display:flex;flex-direction:column;min-width:0}
.lt{font-weight:600;line-height:1.25}.lm{font-size:14px;color:var(--mute);margin-top:2px}
.mini{display:block;height:4px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}.mini i{display:block;height:100%;background:var(--leaf)}
.chev{color:var(--mute);flex:none}
.empty{color:var(--mute);font-size:15px}
.arow{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.arow.isdone{background:transparent}
.atop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.atxt{display:flex;flex-direction:column}.at{font-weight:600;line-height:1.25}.am{font-size:14px;color:var(--mute)}
.isdone .at{text-decoration:line-through;color:var(--mute)}
.late{color:var(--bad)}
.dpanel{margin-top:12px}.dpanel label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.dpanel textarea{display:block;width:100%;margin-top:6px;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:16px;font-weight:400}
.anote{font-size:14px;color:var(--mute);margin:8px 0 0}
.foot{text-align:center;padding:24px 24px calc(36px + env(safe-area-inset-bottom));color:var(--mute);font:italic 400 19px/1.4 var(--serif);max-width:640px;margin:0 auto}
@media(min-width:900px){
  .home{display:grid;grid-template-columns:5fr 6fr;gap:56px;align-items:start;padding-top:40px}
  .home-l{position:sticky;top:86px}
  .home-r .sec{margin-top:0}
  .hero h1{font-size:40px}
}

/* auth */
.auth{min-height:100vh;min-height:100dvh;display:grid;align-content:start}
.auth-hero{background:radial-gradient(120% 90% at 85% 0%,#44663F 0%,var(--forest-d) 62%);color:#fff;padding:calc(env(safe-area-inset-top) + 26px) 22px 56px}
.auth-logo{width:230px;display:block;margin-bottom:34px}
.auth-hero h1{font-size:40px;margin-bottom:10px}
.auth-hero p{color:#CFDFC8;max-width:30ch;margin:0}
.auth-card{position:relative;background:#fff;border-radius:22px;margin:-30px 14px 28px;padding:20px 20px 24px;box-shadow:0 18px 40px -22px rgba(34,53,32,.55)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--page);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{border:0;background:none;border-radius:9px;min-height:42px;font-weight:600;color:var(--mute)}
.tabs button[aria-selected=true]{background:#fff;color:var(--forest);box-shadow:0 1px 3px rgba(0,0,0,.12)}
form label{display:block;font-weight:600;font-size:15px;margin-bottom:14px}
form input{display:block;width:100%;margin-top:6px;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:17px;font-weight:400;background:#fff}
form input:focus{border-color:var(--forest);outline:none}
.pw{position:relative;display:block}.pw input{padding-right:50px}
.eye{position:absolute;right:4px;top:6px;width:44px;height:100%;background:none;border:0;color:var(--mute);display:grid;place-items:center}
.hint,.fine{font-size:14px;color:var(--mute)}
.fine{text-align:center;margin:14px 0 0}
.err{color:var(--bad);font-weight:600;font-size:15px;min-height:22px;margin:0 0 8px}
.demo{background:var(--gold-l);border-radius:10px;padding:9px 12px;font-size:14px;margin-bottom:16px}
@media(min-width:860px){
  .auth{grid-template-columns:1fr 1fr;align-content:stretch}
  .auth-hero{display:flex;flex-direction:column;justify-content:center;padding:60px 64px}
  .auth-hero h1{font-size:56px}.auth-hero p{font-size:20px}
  .auth-card{align-self:center;margin:0 auto;width:min(440px,90%);padding:28px}
}

/* intro / end */
.lno{color:var(--forest);font-weight:600;margin-bottom:8px}
.intro h1,.end h1{font-size:40px;margin-bottom:10px}
.meta,.note{color:var(--mute)}
.outcome{background:#fff;border-left:4px solid var(--leaf);border-radius:4px 14px 14px 4px;padding:16px 18px;margin:20px 0}
.outcome h2{font:600 17px var(--sans);margin-bottom:6px}.outcome p{margin:0 0 8px}.outcome p:last-child{margin:0}
.badge{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--forest);color:#fff;margin-bottom:18px}
.badge svg{width:30px;height:30px}
.lead{font-size:18px}

/* player */
.player{display:flex;flex-direction:column;height:100vh;height:100dvh}
.ptop{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.ptop .x{flex:none;width:40px;height:40px;display:grid;place-items:center;background:none;border:0;color:var(--ink);border-radius:50%}
.seg{flex:1;display:flex;gap:4px}.seg i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.seg i.d{background:var(--leaf)}.seg i.c{background:var(--forest)}
.pc{font-size:13px;color:var(--mute);min-width:34px;text-align:right}
.stage{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 14px 24px}
.sheet{max-width:620px;margin:0 auto;background:#fff;border-radius:22px;padding:24px 22px 26px;box-shadow:0 1px 0 var(--line),0 14px 30px -20px rgba(34,53,32,.45);animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kind{display:inline-block;margin:0 0 10px;padding:3px 11px;border-radius:99px;background:var(--leaf-l);color:var(--forest);font-weight:600;font-size:14px}
.sheet h2{font-size:29px;margin-bottom:14px}
.sheet h2:focus{outline:none}
.sheet p{font-size:18px}
.q{font-weight:600;font-size:19px!important}
.pts{margin:0 0 12px;padding-left:22px}.pts li{margin-bottom:8px;font-size:18px}
.callout{background:var(--gold-l);border-radius:12px;padding:12px 14px;font-size:16px!important;margin-top:16px}
.verse{margin:0 0 16px;padding:2px 0 2px 18px;border-left:4px solid var(--leaf)}
.verse p{font:italic 400 23px/1.42 var(--serif);margin:0 0 8px}
.verse footer{font-weight:600;font-size:15px;color:var(--mute)}
.insight{font-size:18px}
.acc details{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.acc details[open]{background:#F8FAF5;border-color:var(--leaf)}
.acc summary{list-style:none;cursor:pointer;padding:14px 46px 14px 16px;font-weight:600;position:relative;line-height:1.3}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:24px;font-weight:400;color:var(--forest)}
.acc details[open] summary::after{content:"\2212"}
.acc details p{padding:0 16px 14px;margin:0;font-size:17px}
.cmp .pair{margin-bottom:14px}
.cmp p{margin:0;padding:12px 14px;font-size:17px}
.cmp .a{background:#EFF2EB;color:var(--mute);border-radius:12px 12px 0 0}
.cmp .b{background:var(--forest);color:#fff;border-radius:0 0 12px 12px;font-weight:600}
.lab{display:block;font-size:13px;font-weight:600;opacity:.7;margin-bottom:2px}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:17px;line-height:1.4}
.opt:not(:disabled):hover{border-color:var(--forest)}
.opt:disabled{color:var(--ink);opacity:.55;cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-l);opacity:1}
.opt.bad{border-color:var(--bad);background:var(--bad-l);opacity:1}
.fb{border-radius:14px;padding:14px 16px;margin-top:14px;font-size:16px}
.fb.good{background:var(--ok-l)}.fb.miss{background:var(--gold-l)}
.srt{padding:14px 0;border-bottom:1px solid var(--line)}.srt:last-child{border:0}
.srt .x{margin:0 0 10px;font-weight:600;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:600;font-size:15px}
.chip:not(:disabled):hover{border-color:var(--forest)}
.chip:disabled{color:var(--ink);opacity:.5;cursor:default}
.chip.ok{border-color:var(--ok);background:var(--ok-l);opacity:1}
.chip.bad{border-color:var(--bad);background:var(--bad-l);opacity:1}
.sheet .why{font-size:15px;margin:8px 0 0}
.score{font-weight:600;margin-top:14px}
.ta{display:block;width:100%;min-height:170px;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:17px;line-height:1.5;resize:vertical;background:#fff}
.ta:focus{border-color:var(--forest);outline:none}
.count{font-size:14px!important;color:var(--mute);margin:8px 0 0}

/* the "put it into practice" card: the one loud element */
.sheet.k-action{background:var(--forest-d);color:#E8F0E3}
.k-action .kind{background:var(--gold);color:#2B1F00}
.k-action h2{color:#fff}
.k-action .lead{color:#C7D8C0}
.steps{list-style:none;counter-reset:s;margin:0 0 16px;padding:0}
.steps li{counter-increment:s;position:relative;padding:0 0 12px 40px;font-size:18px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#2B1F00;font-weight:700;font-size:15px;display:grid;place-items:center}
.donewhen{background:rgba(255,255,255,.09);border-radius:12px;padding:12px 14px;font-size:16px!important}
.flds label{display:block;font-weight:600;font-size:15px;margin-bottom:12px;color:#fff}
.ta.dark{margin-top:6px;min-height:84px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28);color:#fff}
.ta.dark:focus{border-color:var(--gold)}
.due{display:block;font-weight:600;font-size:15px;margin:16px 0 6px;color:#fff}
.due input{display:block;margin-top:6px;width:100%;border:2px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;color-scheme:dark;border-radius:12px;padding:12px 14px;font-size:17px}
.committed{display:flex;align-items:center;gap:10px;color:var(--gold);font-weight:600;margin-top:16px}
.k-action .fine{color:#C7D8C0;text-align:left}

.dock{padding:8px 14px calc(10px + env(safe-area-inset-bottom));background:var(--page);border-top:1px solid var(--line)}
.drow{display:flex;gap:10px;max-width:620px;margin:0 auto}
.drow .grow{flex:1}
.drow .btn.ghost{padding:0 16px}
.need{max-width:620px;margin:0 auto 6px;text-align:center;font-size:14px;color:var(--mute);min-height:20px}


/* gating, certificate banner, prefs */
.lrow.locked{opacity:.6;cursor:not-allowed;background:transparent}
.lrow.locked:hover{border-color:var(--line)}
.lrow.locked .num{background:var(--line);color:var(--mute)}
.certcard{background:var(--forest-d);color:#E8F0E3;border-radius:18px;padding:18px 20px 20px;margin:14px 0 4px}
.certcard h2{font-size:26px;color:#fff;margin-bottom:6px}.certcard p{color:#C7D8C0;margin:0 0 4px}
.prefs{text-align:center;font-size:14px;color:var(--mute);margin:8px 16px 0}.prefs .link{font-size:14px}
.endlab{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.endlab textarea{display:block;width:100%;margin-top:6px;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:16px;font-weight:400}
.ctr{text-align:center}

/* certificate */
.certwrap{max-width:920px;margin:0 auto;padding:18px 12px 40px}
.cert{container-type:inline-size;aspect-ratio:1.4142/1;background:#fff;box-shadow:0 1px 0 var(--line),0 18px 40px -24px rgba(34,53,32,.55);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cert-in{position:relative;height:100%;display:flex;flex-direction:column;text-align:center;color:var(--ink)}
.cert-in::after{content:"";position:absolute;inset:2.5cqw;border:.25cqw solid var(--forest);pointer-events:none}
.c-band{background:var(--forest);height:23.5%;display:flex;align-items:center;justify-content:center;border-bottom:.7cqw solid var(--gold)}
.c-band img{width:36%;height:auto}
.c-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 9cqw}
.c-kick{font:600 4.4cqw/1.1 var(--serif);color:var(--forest);margin:0 0 1.6cqw}
.c-this,.c-txt{font:400 2.1cqw/1.45 var(--sans);color:var(--mute);margin:0}
.c-name{font:600 7cqw/1.1 var(--serif);margin:1cqw auto 1.4cqw;padding-bottom:1.2cqw;border-bottom:.2cqw solid var(--line);max-width:88%}
.c-course{font:600 4.8cqw/1.15 var(--serif);color:var(--forest);margin:1cqw 0 1cqw}
.c-foot{display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:end;gap:2cqw;padding:0 8.5cqw 6.5cqw}
.c-foot>div{border-top:.2cqw solid var(--forest);padding-top:1cqw}
.c-v{font:600 1.9cqw/1.2 var(--sans);margin:0}.c-l{font:400 1.5cqw/1.3 var(--sans);color:var(--mute);margin:.3cqw 0 0}
.c-tag{font:italic 400 1.9cqw/1.3 var(--serif);color:#7A5A10;margin:0}
.cert-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:18px}
@media print{
  @page{size:A4 landscape;margin:0}
  html,body{background:#fff!important}
  .noprint,.top{display:none!important}
  .certwrap{max-width:none;padding:0}
  .cert{width:100vw;height:100vh;aspect-ratio:auto;box-shadow:none}
}

@media(min-width:700px){.sheet{padding:34px 36px 36px}.sheet h2{font-size:34px}.stage{padding-top:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"><div class="boot"><img src="assets/logo.png" alt="Real Life Christian Communities" width="220" height="24"></div></div>
